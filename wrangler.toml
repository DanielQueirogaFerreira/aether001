# Cloudflare Workers Builds — aether001 is a Worker, not Pages.
# Dashboard build command can stay: npm run build:cf
name = "aether001"
compatibility_date = "2026-08-21"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[build]
command = "npm run build:cf"
