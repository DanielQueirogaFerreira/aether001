# Cloudflare Pages — Git build
# Dashboard only needs the build command: npm run build:cf
# Output directory (dist) and Node 22 live in this repo so the other
# dashboard fields are optional.
name = "aether001"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[build]
command = "npm run build:cf"
