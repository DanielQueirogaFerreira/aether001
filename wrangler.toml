# Cloudflare Workers Builds (the aether001 service is a Worker, not Pages).
# Dashboard build command: npm run build:cf
# Output directory is dist — do not use pages_build_output_dir here.
name = "aether001"
compatibility_date = "2026-08-21"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
